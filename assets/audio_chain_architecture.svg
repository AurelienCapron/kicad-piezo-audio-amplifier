<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="470" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="500" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">CHAÎNE D'ACQUISITION ET D'AMPLIFICATION AUDIO PIÉZOÉLECTRIQUE (2 CARTES PCB CMS)</text>

  <!-- CARTE PCB 1 -->
  <rect x="25" y="55" width="950" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="55" width="950" height="32" rx="10" fill="#0284c7"/>
  <rect x="25" y="77" width="950" height="10" fill="#0284c7"/>
  <text x="500" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">CARTE PCB 1 — CONDITIONNEMENT, ÉGALISATION BAXANDALL ET CONTRÔLE DE VOLUME (ST TSV912IDT)</text>

  <!-- Capteur Piezo -->
  <rect x="45" y="105" width="155" height="105" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="122.5" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">Capteur Piézo</text>
  <text x="122.5" y="152" text-anchor="middle" font-size="11" fill="#475569">Entrée Jin1 + C1 (1 µF)</text>
  <text x="122.5" y="170" text-anchor="middle" font-size="11" fill="#475569">Suiveur U1A (Vref = 2,5 V)</text>
  <text x="122.5" y="188" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">Haute impédance</text>

  <!-- Preamp -->
  <rect x="235" y="105" width="175" height="105" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="322.5" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">Préamplificateur</text>
  <text x="322.5" y="152" text-anchor="middle" font-size="11" fill="#475569">AOP ST TSV912 (U1B)</text>
  <text x="322.5" y="170" text-anchor="middle" font-size="11" fill="#475569">R5 = 10 kΩ | R6 = 100 kΩ</text>
  <text x="322.5" y="188" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">Gain = +20 dB (Av = -10)</text>

  <!-- Baxandall -->
  <rect x="445" y="105" width="240" height="105" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="565" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">Correcteur de Tonalité Actif</text>
  <text x="565" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Filtre de Baxandall (U2A)</text>
  <text x="565" y="167" text-anchor="middle" font-size="11" fill="#475569">Graves (RV1 50k) : ±12,6 dB (&lt; 100 Hz)</text>
  <text x="565" y="184" text-anchor="middle" font-size="11" fill="#475569">Aigus (RV2 50k) : ±11,2 dB (&gt; 4 kHz)</text>
  <text x="565" y="201" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">Fréquence pivot : 1 kHz (0 dB)</text>

  <!-- Volume + Alim -->
  <rect x="720" y="105" width="235" height="105" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="837.5" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">Volume Actif &amp; Alim. LDO</text>
  <text x="837.5" y="150" text-anchor="middle" font-size="11" fill="#475569">Volume (U2B) : R7 (10k) + RV3 (50k)</text>
  <text x="837.5" y="168" text-anchor="middle" font-size="11" fill="#475569">Régulateur U3 : TLV1117-50 (12V → 5V)</text>
  <text x="837.5" y="188" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">Sortie dynamique max : 5 Vpp (JS1)</text>

  <!-- Flèches PCB 1 -->
  <line x1="200" y1="157" x2="229" y2="157" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="410" y1="157" x2="439" y2="157" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="685" y1="157" x2="714" y2="157" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- CARTE PCB 2 -->
  <rect x="25" y="260" width="950" height="185" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="260" width="950" height="32" rx="10" fill="#0f766e"/>
  <rect x="25" y="282" width="950" height="10" fill="#0f766e"/>
  <text x="500" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">CARTE PCB 2 — CORRECTEUR PHYSIOLOGIQUE LOUDNESS ET AMPLIFICATION DE PUISSANCE</text>

  <!-- Loudness -->
  <rect x="45" y="315" width="235" height="110" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="162.5" y="340" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">Correcteur Loudness Passif</text>
  <text x="162.5" y="360" text-anchor="middle" font-size="11" fill="#334155">RV5 (10 kΩ), R10 (120 Ω), R11 (10 kΩ)</text>
  <text x="162.5" y="378" text-anchor="middle" font-size="11" fill="#334155">Filtres C9 (15 µF) &amp; C10 (180 pF)</text>
  <text x="162.5" y="398" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0d9488">Compensation psychoacoustique</text>

  <!-- Jumper J9 -->
  <rect x="315" y="335" width="120" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Sélecteur J9</text>
  <text x="375" y="380" text-anchor="middle" font-size="10.5" fill="#475569">Choix de la voie</text>
  <text x="375" y="395" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">Classe AB / Classe D</text>

  <!-- Classe AB -->
  <rect x="475" y="302" width="255" height="62" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="602.5" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Ampli Classe AB — ST TS4871IDT</text>
  <text x="602.5" y="342" text-anchor="middle" font-size="11" fill="#475569">Boîtier SOIC-8 | Gain unitaire (22 kΩ / 22 kΩ)</text>
  <text x="602.5" y="357" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b45309">Sortie BTL linéaire + Mode Standby (J13)</text>

  <!-- Classe D -->
  <rect x="475" y="374" width="255" height="62" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="602.5" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">Ampli Classe D — ST TS4962</text>
  <text x="602.5" y="414" text-anchor="middle" font-size="11" fill="#92400e">Boîtier DFN-8 (3×3 mm) | PWM fsw = 266 kHz</text>
  <text x="602.5" y="429" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b45309">Sortie BTL haut rendement (Gain Av = 2)</text>

  <!-- Haut-parleur -->
  <rect x="770" y="320" width="185" height="100" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="862.5" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Haut-Parleur Mono</text>
  <text x="862.5" y="370" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">Impédance : 8 Ω (~2 W)</text>
  <text x="862.5" y="390" text-anchor="middle" font-size="10.5" fill="#475569">Diffusion acoustique ou</text>
  <text x="862.5" y="405" text-anchor="middle" font-size="10.5" fill="#475569">mesure diff. (CH2 - CH3)</text>

  <!-- Flèches liaison PCB1 -> PCB2 et internes PCB2 -->
  <path d="M 837.5 210 L 837.5 245 L 162.5 245 L 162.5 309" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-teal)"/>
  <line x1="280" y1="370" x2="309" y2="370" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M 435 355 L 455 355 L 455 333 L 469 333" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 435 385 L 455 385 L 455 405 L 469 405" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 730 333 L 750 333 L 750 355 L 764 355" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 730 405 L 750 405 L 750 385 L 764 385" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
</svg>
